name: Build i deploy na Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Przy szybkiej serii commitow liczy sie tylko ostatni - inaczej dwa deploye
  # potrafia sie wyscigowac o ten sam kontener.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Buduje obraz i wypycha go do GitHub Container Registry. Dziala przy kazdym
  # pushu, takze zanim skonfigurujesz Hostingera - dzieki temu blad w Dockerfile
  # wychodzi od razu, a nie dopiero na produkcji.
  build:
    name: Zbuduj obraz
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Zaloguj sie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zbuduj i wypchnij obraz
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Wdroz na VPS
    needs: build
    # Pomijane, dopoki nie ustawisz HOSTINGER_VM_ID w
    # Settings -> Secrets and variables -> Actions -> Variables.
    if: vars.HOSTINGER_VM_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Akcja przekazuje Hostingerowi tylko adres URL do docker-compose.yml,
      # wiec plik musi byc publicznie osiagalny (repo publiczne). Obraz jest
      # pobierany z GHCR, a nie budowany na serwerze.
      - name: Deploy na VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: indexmenow
          docker-compose-path: docker-compose.yml
          environment-variables: |
            DOMAIN=${{ vars.DOMAIN }}
            BASE_URL=${{ vars.BASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            ALLOWED_EMAILS=${{ vars.ALLOWED_EMAILS }}
            TIMEZONE=${{ vars.TIMEZONE || 'Europe/Warsaw' }}
            AUTO_INDEX_HOUR=${{ vars.AUTO_INDEX_HOUR || '3' }}
            DEFAULT_DAILY_QUOTA=${{ vars.DEFAULT_DAILY_QUOTA || '200' }}
