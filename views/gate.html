<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dostep — {{ app_name }}</title>
  <link rel="icon" href="{{ '/static/img/favicon.svg'|asset }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/static/css/app.css'|asset }}">
  <script>(function(){var t=localStorage.getItem("imp-theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="auth-wrap" style="min-height:100vh;align-items:center;justify-content:center">
  <section class="auth-panel" style="max-width:420px;width:100%;margin:0 auto">
    <div class="auth-card">
      <div class="brand" style="padding-left:0;margin-bottom:28px">
        <span class="brand-mark">I</span>
        <span>IndexMeNow<small>wejscie chronione</small></span>
      </div>

      <h1 style="font-size:1.5rem;margin-bottom:8px">Podaj haslo</h1>

      {% if error %}
        <div class="callout bad mb-2">{{ error }}</div>
      {% endif %}

      <form method="post" action="/gate/login">
        <div class="field mb-2">
          <label class="lbl" for="password">Haslo</label>
          <input class="input" id="password" type="password" name="password" required autofocus
                 autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Wejdz</button>
      </form>
    </div>
  </section>
</div>
<script src="{{ '/static/js/app.js'|asset }}"></script>
</body>
</html>
